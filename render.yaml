# Render Blueprint - deploys this app as a single free web service.
#
# Setup:
#   1. Push this repo to GitHub (or GitLab/Bitbucket).
#   2. In the Render dashboard: New -> Blueprint -> connect the repo.
#      Render reads this file automatically and creates the service below.
#   3. First deploy takes a few minutes (installing dependencies).
#
# Free tier note: the instance sleeps after 15 minutes with no traffic and
# loses its local disk on wake, so database/events.db resets to freshly
# re-crawled data each time it wakes up rather than accumulating forever.
# Everything except config/manual_learning_programs.json (which lives in the
# git repo, not the database) is re-derived from the public sources anyway.
#
# To add real persistence later: upgrade the service to a paid instance type
# and attach a Render Disk mounted at /var/data, then set the DATABASE_PATH
# env var below to /var/data/events.db.

services:
  - type: web
    name: rextech-event-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Uncomment once a paid plan + persistent Disk are attached:
      # - key: DATABASE_PATH
      #   value: /var/data/events.db
