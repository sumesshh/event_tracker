<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event and Grant Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">E</span>
      <div>
        <h1>Event and Grant Tracker</h1>
        <p class="brand-sub">Opportunity Discovery</p>
      </div>
    </div>

    <div class="topbar-actions">
      <!-- Primary navigation -->
      <nav class="nav-links">
        <a href="/events" class="nav-link">Events</a>
        <a href="/events?category=Startup%20Funding" class="nav-link">Grants &amp; Funding</a>
        <a href="/events?state=Kerala" class="nav-link">Kerala</a>
        <a href="/events?tag=Hackathon" class="nav-link">Hackathons</a>
      </nav>

      <!-- Refresh asks the backend to crawl all sources right now -->
      <button id="refreshBtn" class="ghost-btn" title="Check all sources now">
        Refresh
      </button>

      <!-- The notification bell. Clicking it opens the New Events page. -->
      <a href="/new" id="bell" class="bell" title="New events">
        🔔<span id="bellCount" class="bell-count">0</span>
      </a>
    </div>
  </header>

  <main class="wrap">

    <!-- ================= NOTIFICATION BOX ================= -->
    <!-- Shows "🔔 12 New Events" when there are new ones, otherwise
         "No New Events". Clicking it opens the New Events page. -->
    <a href="/new" id="noticeBox" class="notice">
      <span class="notice-icon">🔔</span>
      <span id="noticeText" class="notice-text">Checking for new events…</span>
      <span class="notice-cta">View →</span>
    </a>

    <!-- ================= STAT STRIP ================= -->
    <section class="stats" id="statStrip">
      <a class="stat" href="/events"><b id="statTotal">–</b><span>Total Events</span></a>
      <a class="stat" href="/events?upcoming=1"><b id="statUpcoming">–</b><span>Upcoming</span></a>
      <a class="stat" href="/events?status=Closing%20Soon"><b id="statClosing">–</b><span>Closing Soon</span></a>
      <a class="stat" href="/events?focus=1"><b id="statFocus">–</b><span>Game · AR/VR · Apps</span></a>
      <a class="stat" href="/new"><b id="statNew">–</b><span>New</span></a>
    </section>

    <!-- Opportunity-type counters, built at runtime from stats.opportunities
         so the labels and the numbers can never disagree. Courses are not
         represented because they are never stored. -->
    <section class="stats" id="opportunityStrip"></section>

    <!-- ================= PRIORITY SECTIONS =================
         Built at runtime from /api/summary, in the order config/priority.py
         defines: Kerala first, then the priority collections, then Tamil
         Nadu, Chennai, Karnataka, India, Middle East, Japan, then the topic
         views. Sections with no matching records are not rendered at all. -->
    <div id="sections"></div>

    <!-- ================= RECENT EVENTS ================= -->
    <section class="block">
      <div class="block-head">
        <h2>Recently Discovered</h2>
        <a class="see-all" href="/events?order=recent">See all</a>
      </div>
      <div id="recentGrid" class="grid"></div>
    </section>

  </main>

  <footer class="foot">
    <span id="footStatus">Sources are checked automatically every 6 hours.</span>
  </footer>

  <script src="/static/app.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
